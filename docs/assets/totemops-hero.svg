<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">TotemOps — Minecraft crash diagnostics visual</title>
<desc id="desc">A blocky Minecraft-style world and server shown on the left, with an error log transformed into verified diagnostic evidence and a safe repair plan on the right. Original concept art, not a game screenshot.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071624"/><stop offset=".54" stop-color="#102c36"/><stop offset="1" stop-color="#122044"/></linearGradient>
 <linearGradient id="grass" x1="0" x2="1"><stop stop-color="#5bed97"/><stop offset="1" stop-color="#19bfa5"/></linearGradient>
 <linearGradient id="dirt" x1="0" x2="1"><stop stop-color="#905940"/><stop offset="1" stop-color="#52354e"/></linearGradient>
 <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#213c50"/><stop offset="1" stop-color="#0b1c30"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#9ad5d6" stroke-opacity=".065" fill="none"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".36"/></filter>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>

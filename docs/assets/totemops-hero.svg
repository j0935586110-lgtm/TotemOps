<text x="974" y="417" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#c7d9e4">NO AUTO CHANGES</text>
</g>
<text x="54" y="57" font-family="system-ui,Arial,sans-serif" font-size="15" letter-spacing="3" fill="#8fe5bd" font-weight="800">MINECRAFT • TROUBLESHOOTING • SAFETY</text>
<text x="55" y="523" font-family="system-ui,Arial,sans-serif" font-size="14" fill="#c0dfdb">Concept illustration / 示意插畫 · Not a captured Minecraft screenshot</text>
